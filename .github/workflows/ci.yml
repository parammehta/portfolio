name: CI

# Runs on every PR into main, and on main itself so the branch always has a
# known-good baseline. The job names here are what branch protection requires:
#   Lint & types / Unit tests / Integration tests / Build / E2E tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run stylelint
      - run: npm run typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm
      - run: npm ci
      - run: npm run test:unit -- --ci

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm
      - run: npm ci
      - run: npm run test:integration -- --ci

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_WEBSITE_URL: ${{ vars.NEXT_PUBLIC_WEBSITE_URL }}
          # Deliberately NOT NEXT_PUBLIC_CLOUDFLARE_ANALYTICS_TOKEN: setting it
          # here injects the Cloudflare beacon into this build, and the beacon's
          # RUM request gets CORS-blocked against the e2e job's 127.0.0.1 origin,
          # which the e2e console-error assertion then flags as a failure. This
          # build only feeds e2e, never a real deploy — Vercel builds production
          # separately, with the token set on the project, so analytics ships.
          NEXT_PUBLIC_ANALYTICS_EVENTS_URL: ${{ vars.NEXT_PUBLIC_ANALYTICS_EVENTS_URL }}
          NEXT_PUBLIC_CLOUDFLARE_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_CLOUDFLARE_TURNSTILE_SITE_KEY }}
      # The e2e job runs against these exact bytes rather than rebuilding.
      #
      # `public/` rides along because `next start` serves it from the source
      # tree rather than copying it into `.next/`, and parts of it only exist
      # after a build: scripts/generate-sitemap.js writes public/sitemap.xml,
      # scripts/draco.js copies the decoder and .glb models, and all of those
      # are gitignored, so a fresh checkout does not have them. (The old
      # `build/` artifact was a static export, which had already absorbed
      # public/ — dropping it here 404'd /sitemap.xml in e2e.)
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next/
            public/
          retention-days: 1
          include-hidden-files: true

  e2e:
    name: E2E tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm
      - run: npm ci
      # Unpacked at the repo root: the artifact carries both .next/ and public/
      # with their paths, and overlays public/ onto the checkout's own copy.
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:only
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
