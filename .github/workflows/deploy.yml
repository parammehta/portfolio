name: Deploy

# Triggered when the Release workflow publishes a GitHub Release (which only
# happens when a release is actually cut). Because release-please creates that
# release with the PAT, the `release` event fires and reaches this workflow.
# `workflow_dispatch` allows a manual out-of-band deploy of whatever is on main.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Re-run the full CI suite (lint, types, unit, integration, build, e2e)
  # against the released commit. The PR gate already ran it, but a release can
  # also be cut manually via workflow_dispatch, and nothing should reach S3
  # without the tests having passed on exactly these bytes.
  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Build & Deploy
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_WEBSITE_URL: ${{ vars.NEXT_PUBLIC_WEBSITE_URL }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_CLOUDFLARE_ANALYTICS_TOKEN: ${{ vars.NEXT_PUBLIC_CLOUDFLARE_ANALYTICS_TOKEN }}
          NEXT_PUBLIC_ANALYTICS_EVENTS_URL: ${{ vars.NEXT_PUBLIC_ANALYTICS_EVENTS_URL }}
          NEXT_PUBLIC_CLOUDFLARE_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_CLOUDFLARE_TURNSTILE_SITE_KEY }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - run: npm run deploy
