name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Version & Release
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # A PAT (not the default GITHUB_TOKEN) is required so that the
          # auto-merge below produces a push that RE-TRIGGERS this workflow,
          # letting release-please tag and publish the release. Actions taken
          # with GITHUB_TOKEN never trigger workflows, so with it the Release PR
          # would merge and then nothing would tag the commit.
          #
          # This no longer gates shipping: Vercel deploys every push to main,
          # release or not. It gates the tag and the changelog.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Merge ONLY the Release PR that release-please just created (targeted by
      # its exact PR number) so releases ship without manual intervention. No
      # other PRs are affected.
      #
      # `--auto` queues the merge behind main's required status checks instead
      # of merging immediately: with branch protection in place a direct merge
      # would be rejected while CI is still pending. This requires the repo's
      # "Allow auto-merge" setting to be enabled.
      - name: Merge the Release PR
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: gh pr merge --squash --auto "${{ fromJson(steps.release.outputs.pr).number }}" -R ${{ github.repository }}
