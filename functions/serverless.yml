service: parammehta-portfolio

provider:
  name: aws
  runtime: nodejs20.x
  stage: dev
  region: us-east-1
  memorySize: 128
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - ses:SendEmail
            - ses:SendRawEmail
          Resource: '*'

functions:
  api:
    handler: index.handler
    architecture: arm64
    environment:
      CLOUDFLARE_TURNSTILE_SECRET: ${env:CLOUDFLARE_TURNSTILE_SECRET, ''}
    events:
      - http:
          path: /
          method: ANY
          cors: true
      - http:
          path: /{proxy+}
          method: ANY
          cors: true
