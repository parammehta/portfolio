service: parammehta-portfolio

# The handler is plain `.js`, so v4's built-in esbuild would not run on it
# anyway (it only builds TypeScript handlers by default). Pinning it off keeps
# packaging identical to v3: jsdom resolves its resource files at runtime and
# does not survive being bundled into a single file.
build:
  esbuild: false

provider:
  name: aws
  # AWS auto-migrates functions off runtimes it is deprecating, so the live
  # function had already moved to nodejs22.x on its own. Kept in step here so a
  # deploy stops silently rolling it back.
  runtime: nodejs22.x
  stage: dev
  region: us-east-1
  memorySize: 128
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - ses:SendEmail
            - ses:SendRawEmail
          Resource: '*'

functions:
  api:
    handler: index.handler
    architecture: arm64
    environment:
      CLOUDFLARE_TURNSTILE_SECRET: ${env:CLOUDFLARE_TURNSTILE_SECRET, ''}
    events:
      - http:
          path: /
          method: ANY
          cors: true
      - http:
          path: /{proxy+}
          method: ANY
          cors: true
